<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Mod Store - Premium Accounts & Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-tr from-amber-600 to-orange-500 rounded-lg flex items-center justify-center text-white font-bold shadow">
                    <i class="fa-solid fa-shield-cat text-sm"></i>
                </div>
                <span class="font-bold text-xs text-gray-700">Fox Mod Store</span>
            </div>
            <div class="flex items-center space-x-2">
                <a href="admin.html" class="w-8 h-8 bg-slate-100 rounded-full text-slate-700 flex items-center justify-center hover:bg-slate-200" title="Admin">
                    <i class="fa-solid fa-lock text-xs"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 py-3 space-y-4">
        <div class="relative rounded-2xl overflow-hidden shadow-md bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-950 text-white p-4">
            <h2 class="text-lg font-black tracking-wide">foxmod.site <span class="text-orange-400 font-normal">Happy New Year!</span></h2>
            <p class="text-[11px] text-gray-300 mt-0.5">YOUR ULTIMATE DESTINATION FOR PREMIUM LICENSE KEYS.</p>
        </div>

        <div>
            <div class="flex items-center justify-between mb-2 px-1">
                <h3 class="font-bold text-sm text-gray-900">Featured Products & Services</h3>
                <span id="productCount" class="text-[11px] font-semibold text-gray-500 bg-gray-200 px-2 py-0.5 rounded-md">items</span>
            </div>
            <div id="productGrid" class="grid grid-cols-2 gap-2.5"></div>
        </div>
    </main>

    <!-- PURCHASE MODAL -->
    <div id="productModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden flex flex-col">
            <div class="bg-gray-50 px-3 py-2.5 border-b flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-xs text-gray-900">Select Service</h3>
                <button onclick="closeProductModal()" class="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center"><i class="fa-solid fa-xmark text-[10px]"></i></button>
            </div>
            <div class="p-3.5 space-y-3">
                <div class="pt-2 border-t flex items-center justify-between">
                    <span class="text-[11px] font-bold text-gray-700">Total Amount:</span>
                    <span id="modalTotalAmount" class="text-base font-black text-blue-600">$2.50</span>
                </div>
            </div>
            <div class="p-3 bg-gray-50 border-t flex items-center space-x-2">
                <button onclick="closeProductModal()" class="w-1/2 bg-gray-200 text-gray-700 font-bold text-[11px] py-2 rounded-xl">Cancel</button>
                <button onclick="proceedToCheckout()" class="w-1/2 bg-blue-600 text-white font-bold text-[11px] py-2 rounded-xl shadow">Pay with KHQR</button>
            </div>
        </div>
    </div>

    <!-- KHQR CUSTOM IMAGE MODAL -->
    <div id="qrModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl shadow-2xl p-5 text-center relative space-y-3">
            <button onclick="closeQrModal()" class="absolute top-2.5 right-2.5 w-6 h-6 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center"><i class="fa-solid fa-xmark text-[10px]"></i></button>
            <div>
                <span class="bg-red-600 text-white text-[9px] font-extrabold px-2 py-0.5 rounded uppercase">KHQR PAYMENT</span>
                <h3 class="font-bold text-xs text-gray-800 mt-1.5" id="qrServiceName">Service Name</h3>
                <p id="qrDisplayAmount" class="text-lg font-black text-blue-600 mt-0.5">$2.50 USD</p>
            </div>
            
            <!-- Display Custom QR Uploaded by Admin -->
            <div class="bg-white p-2 rounded-xl border-2 border-red-500 inline-block shadow-inner">
                <img id="customQrImg" src="" alt="Custom KHQR" class="w-48 h-48 mx-auto rounded-md object-contain">
            </div>

            <div class="text-[10px] text-gray-500">
                <p class="font-medium text-gray-700">ស្កេនទូទាត់ជាមួយកម្មវិធីធនាគារណាមួយក៏បាន</p>
            </div>
            <button onclick="alert('សូមអរគុណ! ប្រព័ន្ធបានទទួលការបញ្ជាទិញរបស់អ្នកហើយ។'); closeQrModal();" class="w-full bg-emerald-600 text-white font-bold text-[11px] py-2.5 rounded-xl shadow">I Have Paid / Done</button>
        </div>
    </div>

    <script>
        let defaultProducts = [
            { id: 1, name: "Snake Egine 2 8BP", price: 2.50, img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80", qrImg: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=sampleQR1" }
        ];

        let products = JSON.parse(localStorage.getItem('store_products')) || defaultProducts;
        let selectedProduct = null;

        window.onload = function() { renderStore(); }

        function renderStore() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            document.getElementById('productCount').innerText = products.length + ' items';

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="relative bg-gray-900 h-28 overflow-hidden">
                                <span class="absolute top-2 left-2 z-10 bg-red-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase">HOT</span>
                                <img src="${p.img}" class="w-full h-full object-cover opacity-85">
                            </div>
                            <div class="p-2.5">
                                <h4 class="font-bold text-xs text-gray-900 leading-tight">${p.name}</h4>
                                <div class="mt-1 text-blue-600 font-bold text-sm">$${p.price.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="p-2.5 pt-0">
                            <button onclick='openProductModal(${JSON.stringify(p)})' class="w-full bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold py-2 rounded-lg shadow-sm">Buy Now</button>
                        </div>
                    </div>
                `;
            });
        }

        function openProductModal(product) {
            selectedProduct = product;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalTotalAmount').innerText = '$' + product.price.toFixed(2);
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('productModal').classList.add('hidden'); }

        function proceedToCheckout() {
            closeProductModal();
            // បង្ហាញរូបភាព QR ផ្ទាល់ខ្លួនដែល Admin បាន Upload សម្រាប់ផលិតផល/តម្លៃនេះ
            document.getElementById('qrServiceName').innerText = selectedProduct.name;
            document.getElementById('qrDisplayAmount').innerText = '$' + selectedProduct.price.toFixed(2) + ' USD';
            document.getElementById('customQrImg').src = selectedProduct.qrImg;
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }
    </script>
</body>
</html>
