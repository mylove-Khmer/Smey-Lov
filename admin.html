<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fox Mod Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800">
    <div class="max-w-lg mx-auto px-3 py-4 space-y-4">
        
        <div class="bg-slate-900 text-white p-4 rounded-xl shadow flex items-center justify-between">
            <div>
                <h2 class="font-bold text-sm">🛠️ Admin Control Panel</h2>
                <p class="text-[10px] text-gray-400">គ្រប់គ្រងទំនិញ ដាក់លុយ និងឆែកមើលភ្ញៀវ</p>
            </div>
            <a href="index.html" class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅហាង
            </a>
        </div>

        <!-- Tabs -->
        <div class="flex space-x-1 bg-white p-1 rounded-xl shadow-sm text-xs font-bold text-center">
            <button onclick="switchTab('products')" id="tabBtnProducts" class="flex-1 py-2 rounded-lg bg-blue-600 text-white">គ្រប់គ្រងទំនិញ</button>
            <button onclick="switchTab('users')" id="tabBtnUsers" class="flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100">ឆែកមើលភ្ញៀវ & ដាក់លុយ</button>
        </div>

        <!-- SECTION 1: PRODUCTS -->
        <div id="sectionProducts" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">➕ បន្ថែមទំនិញ / សេវាកម្មថ្មី</h3>
                <div class="space-y-2 text-xs">
                    <input type="text" id="prodName" placeholder="ឈ្មោះទំនិញ (ឧ: Telegram Premium)" class="w-full p-2.5 border rounded-lg outline-none">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="prodPrice" placeholder="តម្លៃដើម ($)" step="0.01" class="p-2.5 border rounded-lg outline-none">
                        <input type="number" id="prodSalePrice" placeholder="តម្លៃចុះ ($)" step="0.01" class="p-2.5 border rounded-lg outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="prodDuration" placeholder="អាយុកាល (ឧ: 30 Days)" class="p-2.5 border rounded-lg outline-none">
                        <input type="number" id="prodStock" placeholder="ចំនួនស្តុក (Stock)" class="p-2.5 border rounded-lg outline-none">
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-gray-600">🔑 ព័ត៌មានអាខោន (Email & Password សម្រាប់ផ្ដល់ជូនភ្ញៀវ):</label>
                        <textarea id="prodAccountDetails" placeholder="Email: xxx@gmail.com | Password: xxx" class="w-full p-2 border rounded-lg h-16 outline-none text-xs"></textarea>
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-gray-600">🖼️ រូបភាពទំនិញ:</label>
                        <input type="file" id="prodImgFile" accept="image/*" class="w-full p-2 border rounded-lg bg-gray-50">
                    </div>
                    <button onclick="addProduct()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg shadow">រក្សាទុកទំនិញ</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">📦 បញ្ជីទំនិញទាំងអស់ក្នុងស្តុក</h3>
                <div id="adminProductList" class="space-y-2"></div>
            </div>
        </div>

        <!-- SECTION 2: USERS & TOPUP -->
        <div id="sectionUsers" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">💵 ដាក់ប្រាក់ចូលកាបូបភ្ញៀវ</h3>
                <div class="space-y-2 text-xs">
                    <input type="text" id="topupTarget" placeholder="អ៊ីមែល ឬ លេខទូរសព្ទអតិថិជន" class="w-full p-2.5 border rounded-lg outline-none">
                    <input type="number" id="topupVal" placeholder="ចំនួនទឹកប្រាក់ ($)" step="0.01" class="w-full p-2.5 border rounded-lg outline-none">
                    <button onclick="topupUser()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg shadow">បញ្ជាក់ការដាក់ប្រាក់</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">👥 ឆែកមើលបញ្ជីភ្ញៀវ (លេខទូរសព្ទ & អ៊ីមែល)</h3>
                <div id="adminUserList" class="space-y-2"></div>
            </div>
        </div>

    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('store_products')) || [];
        let users = JSON.parse(localStorage.getItem('store_users')) || [];

        window.onload = function() {
            renderAdminProducts();
            renderAdminUsers();
        }

        function switchTab(tab) {
            document.getElementById('sectionProducts').classList.add('hidden');
            document.getElementById('sectionUsers').classList.add('hidden');
            document.getElementById('tabBtnProducts').className = "flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100";
            document.getElementById('tabBtnUsers').className = "flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100";

            if(tab === 'products') {
                document.getElementById('sectionProducts').classList.remove('hidden');
                document.getElementById('tabBtnProducts').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white";
            } else {
                document.getElementById('sectionUsers').classList.remove('hidden');
                document.getElementById('tabBtnUsers').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white";
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 border rounded-lg text-xs bg-gray-50">
                        <div class="flex items-center space-x-3">
                            <img src="${p.img}" class="w-10 h-10 object-cover rounded border">
                            <div>
                                <p class="font-bold text-gray-900">${p.name} <span class="text-orange-500">(${p.duration})</span></p>
                                <p class="text-blue-600 font-semibold">$${p.salePrice} <span class="text-gray-400 line-through">$${p.price}</span> | ស្តុក: ${p.stock}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${index})" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-md font-bold"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addProduct() {
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const salePrice = parseFloat(document.getElementById('prodSalePrice').value);
            const duration = document.getElementById('prodDuration').value;
            const stock = parseInt(document.getElementById('prodStock').value);
            const accountDetails = document.getElementById('prodAccountDetails').value;
            const file = document.getElementById('prodImgFile').files[0];

            if(!name || isNaN(price) || isNaN(salePrice) || !duration || isNaN(stock) || !file) {
                alert('សូមបំពេញព័ត៌មានទំនិញឱ្យបានครบถ้วน!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                products.push({
                    id: Date.now(),
                    name: name,
                    price: price,
                    salePrice: salePrice,
                    duration: duration,
                    stock: stock,
                    accountDetails: accountDetails || "Email: demo@gmail.com | Pass: 123456",
                    img: e.target.result
                });
                localStorage.setItem('store_products', JSON.stringify(products));
                alert('បានបន្ថែមទំនិញដោយជោគជ័យ!');
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function deleteProduct(index) {
            if(confirm('តើអ្នកចង់លុបទំនិញនេះមែនទេ?')) {
                products.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        function renderAdminUsers() {
            const list = document.getElementById('adminUserList');
            list.innerHTML = '';
            if(users.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-2">មិនទាន់មានទិន្ន័យភ្ញៀវ</p>';
                return;
            }
            users.forEach(u => {
                list.innerHTML += `
                    <div class="p-2.5 border rounded-lg bg-gray-50 space-y-1">
                        <div class="flex justify-between font-bold text-gray-900">
                            <span>📧 ${u.email}</span>
                            <span class="text-emerald-600">$${u.balance.toFixed(2)}</span>
                        </div>
                        <p class="text-gray-500 text-[11px]">📱 លេខទូរសព្ទ: ${u.phone}</p>
                    </div>
                `;
            });
        }

        function topupUser() {
            const target = document.getElementById('topupTarget').value.trim();
            const val = parseFloat(document.getElementById('topupVal').value);

            if(!target || isNaN(val) || val <= 0) {
                alert('សូមបញ្ចូលអ៊ីមែល/លេខទូរសព្ទ និងចំនួនទឹកប្រាក់ឱ្យត្រឹមត្រូវ!');
                return;
            }

            let user = users.find(u => u.email === target || u.phone === target);
            if(!user) {
                user = { id: Date.now(), email: target.includes('@') ? target : 'user@gmail.com', phone: target.includes('@') ? '012345678' : target, balance: val };
                users.push(user);
            } else {
                user.balance += val;
            }

            localStorage.setItem('store_users', JSON.stringify(users));
            renderAdminUsers();
            alert(`បានបញ្ចូលប្រាក់ចំនួន $${val.toFixed(2)} ជោគជ័យ!`);
        }
    </script>
</body>
</html>
