<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fox Mod Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800">
    <div class="max-w-lg mx-auto px-3 py-4 space-y-4">
        
        <div class="bg-slate-900 text-white p-4 rounded-xl shadow flex items-center justify-between">
            <div>
                <h2 class="font-bold text-sm">🛠️ Admin Control Panel</h2>
                <p class="text-[10px] text-gray-400">គ្រប់គ្រងសេវាកម្ម និងរូបភាព QR ផ្ទាល់ខ្លួន</p>
            </div>
            <a href="index.html" class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-700">
                <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅហាង
            </a>
        </div>

        <!-- Add Service & Custom QR Form -->
        <div class="bg-white p-4 rounded-xl shadow space-y-3">
            <h3 class="font-bold text-xs text-gray-900 uppercase">➕ បន្ថែមសេវាកម្ម និង Upload រូបភាព QR ផ្ទាល់ខ្លួន</h3>
            <div class="space-y-2 text-xs">
                <input type="text" id="serviceName" placeholder="ឈ្មោះសេវាកម្ម (ឧ: Telegram Premium)" class="w-full p-2.5 border rounded-lg outline-none">
                <input type="number" id="servicePrice" placeholder="តម្លៃសេវាកម្ម ($) ឧ: 2.50" step="0.01" class="w-full p-2.5 border rounded-lg outline-none">
                
                <!-- Product Image Upload -->
                <div class="space-y-1">
                    <label class="font-bold text-gray-600">🖼️ រូបភាពសេវាកម្ម:</label>
                    <input type="file" id="serviceImgFile" accept="image/*" class="w-full p-2 border rounded-lg bg-gray-50 text-xs">
                </div>

                <!-- Custom QR Code Image Upload for this service/price -->
                <div class="space-y-1">
                    <label class="font-bold text-red-600">📷 Upload រូបភាព KHQR សម្រាប់តម្លៃនេះ:</label>
                    <input type="file" id="serviceQrFile" accept="image/*" class="w-full p-2 border rounded-lg bg-red-50 text-xs">
                </div>

                <button onclick="addService()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow">រក្សាទុកសេវាកម្ម & QR</button>
            </div>
        </div>

        <!-- Service List -->
        <div class="bg-white p-4 rounded-xl shadow space-y-3">
            <h3 class="font-bold text-xs text-gray-900 uppercase">📦 បញ្ជីសេវាកម្ម និង QR ក្នុងហាង</h3>
            <div id="adminServiceList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let services = JSON.parse(localStorage.getItem('store_products')) || [];

        window.onload = function() { renderServices(); }

        function renderServices() {
            const list = document.getElementById('adminServiceList');
            list.innerHTML = '';
            services.forEach((s, index) => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 border rounded-lg text-xs bg-gray-50">
                        <div class="flex items-center space-x-3">
                            <img src="${s.img}" class="w-10 h-10 object-cover rounded border">
                            <div>
                                <p class="font-bold text-gray-900">${s.name}</p>
                                <p class="text-blue-600 font-semibold">$${s.price.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold">មាន QR រួចរាល់</span>
                            <button onclick="deleteService(${index})" class="bg-red-100 text-red-600 px-2.5 py-1 rounded font-bold"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function addService() {
            const name = document.getElementById('serviceName').value;
            const price = parseFloat(document.getElementById('servicePrice').value);
            const imgFile = document.getElementById('serviceImgFile').files[0];
            const qrFile = document.getElementById('serviceQrFile').files[0];

            if (!name || isNaN(price) || !imgFile || !qrFile) {
                alert('សូមបំពេញព័ត៌មាន និង Upload រូបភាពផលិតផលព្រមទាំងរូបភាព QR ឱ្យបានครบถ้วน!');
                return;
            }

            const reader1 = new FileReader();
            reader1.onload = function(e1) {
                const imgBase64 = e1.target.result;

                const reader2 = new FileReader();
                reader2.onload = function(e2) {
                    const qrBase64 = e2.target.result;

                    services.push({
                        id: Date.now(),
                        name: name,
                        price: price,
                        img: imgBase64,
                        qrImg: qrBase64 // រូបភាព QR ផ្ទាល់ខ្លួនតាមតម្លៃ
                    });

                    localStorage.setItem('store_products', JSON.stringify(services));
                    alert('បានបន្ថែមសេវាកម្ម និង QR Code ដោយជោគជ័យ!');
                    location.reload();
                };
                reader2.readAsDataURL(qrFile);
            };
            reader1.readAsDataURL(imgFile);
        }

        function deleteService(index) {
            if (confirm('តើអ្នកចង់លុបមែនទេ?')) {
                services.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(services));
                renderServices();
            }
        }
    </script>
</body>
</html>
