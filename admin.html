<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fox Mod Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Kantumruy Pro) -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800">
    <div class="max-w-lg mx-auto px-3 py-4 space-y-4">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-4 rounded-xl shadow flex items-center justify-between">
            <div>
                <h2 class="font-bold text-sm">🛠️ Admin Control Panel</h2>
                <p class="text-[10px] text-gray-400">គ្រប់គ្រងហាង សេវាកម្ម និងអតិថិជន</p>
            </div>
            <a href="index.html" class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-700 transition">
                <i class="fa-solid fa-arrow-left"></i> ត្រឡប់ទៅហាង
            </a>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="flex space-x-1 bg-white p-1 rounded-xl shadow-sm text-xs font-bold text-center">
            <button onclick="switchTab('services')" id="tabBtnServices" class="flex-1 py-2 rounded-lg bg-blue-600 text-white transition">សេវាកម្ម & រូបភាព</button>
            <button onclick="switchTab('users')" id="tabBtnUsers" class="flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">អ្នកប្រើប្រាស់ & ដាក់លុយ</button>
            <button onclick="switchTab('discounts')" id="tabBtnDiscounts" class="flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">កូដបញ្ចុះតម្លៃ</button>
        </div>

        <!-- ================= SECTION 1: SERVICES & PRODUCTS ================= -->
        <div id="sectionServices" class="space-y-4">
            <!-- Add Service Form -->
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">➕ បន្ថែមសេវាកម្ម / ផលិតផលថ្មី</h3>
                <div class="space-y-2 text-xs">
                    <input type="text" id="serviceName" placeholder="ឈ្មោះសេវាកម្ម (ឧ: Telegram Premium 1 Year)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="number" id="servicePrice" placeholder="តម្លៃសេវាកម្ម ($)" step="0.01" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" id="serviceImg" placeholder="Link រូបភាពសេវាកម្ម (Image URL)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="addService()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow transition">រក្សាទុកសេវាកម្ម</button>
                </div>
            </div>

            <!-- Service List -->
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">📦 បញ្ជីសេវាកម្មទាំងអស់ក្នុងហាង</h3>
                <div id="adminServiceList" class="space-y-2">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- ================= SECTION 2: USERS & TOP-UP BALANCE ================= -->
        <div id="sectionUsers" class="space-y-4 hidden">
            <!-- Topup Balance Form -->
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">💵 ដាក់ប្រាក់ចូលកាបូបភ្ញៀវ (Top-up)</h3>
                <div class="space-y-2 text-xs">
                    <select id="selectUser" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="">-- ជ្រើសរើសអតិថិជន --</option>
                    </select>
                    <input type="number" id="topupAmount" placeholder="ចំនួនទឹកប្រាក់ ($)" step="0.01" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="topupUserBalance()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">បញ្ជាក់ការដាក់ប្រាក់</button>
                </div>
            </div>

            <!-- User List (Phone & Email tracking) -->
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">👥 បញ្ជីអ្នកប្រើប្រាស់ (Email & Phone)</h3>
                <div id="adminUserList" class="space-y-2">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- ================= SECTION 3: DISCOUNT / PROMO CODES ================= -->
        <div id="sectionDiscounts" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">🏷️ បង្កើតកូដបញ្ចុះតម្លៃ (Discount Code)</h3>
                <div class="space-y-2 text-xs">
                    <input type="text" id="promoCode" placeholder="កូដបញ្ចុះតម្លៃ (ឧ: SALE50)" class="w-full p-2.5 border rounded-lg uppercase focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="number" id="promoDiscount" placeholder=" אחוזបញ្ចុះតម្លៃ (%) ឬ តម្លៃ ($)" step="0.01" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="addPromoCode()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-lg shadow transition">បង្កើតកូដបញ្ចុះតម្លៃ</button>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold text-xs text-gray-900 uppercase">🎫 កូដបញ្ចុះតម្លៃសកម្ម</h3>
                <div id="adminPromoList" class="space-y-2">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Default Data Storage Initialization
        let services = JSON.parse(localStorage.getItem('store_products')) || [
            { id: 1, name: "Snake Egine 2 8BP", price: 2.50, oldPrice: 55.00, tag: "HOT", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80" },
            { id: 2, name: "Drip Client Non Root", price: 3.00, oldPrice: null, tag: "HOT", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80" }
        ];

        let users = JSON.parse(localStorage.getItem('store_users')) || [
            { id: 101, email: "samnang@gmail.com", phone: "012345678", balance: 5.00 },
            { id: 102, email: "dara@gmail.com", phone: "098765432", balance: 12.50 }
        ];

        let discounts = JSON.parse(localStorage.getItem('store_discounts')) || [
            { code: "NEWYEAR2026", discount: 2.00 }
        ];

        window.onload = function() {
            renderServices();
            renderUsers();
            renderDiscounts();
        }

        // Tab Switching Function
        function switchTab(tab) {
            document.getElementById('sectionServices').classList.add('hidden');
            document.getElementById('sectionUsers').classList.add('hidden');
            document.getElementById('sectionDiscounts').classList.add('hidden');
            
            document.getElementById('tabBtnServices').className = "flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition";
            document.getElementById('tabBtnUsers').className = "flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition";
            document.getElementById('tabBtnDiscounts').className = "flex-1 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition";

            if (tab === 'services') {
                document.getElementById('sectionServices').classList.remove('hidden');
                document.getElementById('tabBtnServices').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition";
            } else if (tab === 'users') {
                document.getElementById('sectionUsers').classList.remove('hidden');
                document.getElementById('tabBtnUsers').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition";
            } else if (tab === 'discounts') {
                document.getElementById('sectionDiscounts').classList.remove('hidden');
                document.getElementById('tabBtnDiscounts').className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition";
            }
        }

        // 1. SERVICES MANAGEMENT
        function renderServices() {
            const list = document.getElementById('adminServiceList');
            list.innerHTML = '';
            services.forEach((s, index) => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 border rounded-lg text-xs bg-gray-50">
                        <div class="flex items-center space-x-3">
                            <img src="${s.img}" class="w-10 h-10 object-cover rounded-md border">
                            <div>
                                <p class="font-bold text-gray-900">${s.name}</p>
                                <p class="text-blue-600 font-semibold">$${s.price.toFixed(2)}</p>
                            </div>
                        </div>
                        <button onclick="deleteService(${index})" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-md font-bold hover:bg-red-200 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addService() {
            const name = document.getElementById('serviceName').value;
            const price = parseFloat(document.getElementById('servicePrice').value);
            const img = document.getElementById('serviceImg').value || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80';

            if (!name || isNaN(price)) {
                alert('សូមបំពេញឈ្មោះសេវាកម្ម និងតម្លៃឱ្យបានត្រឹមត្រូវ!');
                return;
            }

            services.push({ id: Date.now(), name: name, price: price, oldPrice: null, tag: "HOT", img: img });
            localStorage.setItem('store_products', JSON.stringify(services));
            
            document.getElementById('serviceName').value = '';
            document.getElementById('servicePrice').value = '';
            document.getElementById('serviceImg').value = '';
            renderServices();
            alert('បានបន្ថែមសេវាកម្មថ្មីដោយជោគជ័យ!');
        }

        function deleteService(index) {
            if (confirm('តើអ្នកចង់លុបសេវាកម្មនេះមែនទេ?')) {
                services.splice(index, 1);
                localStorage.setItem('store_products', JSON.stringify(services));
                renderServices();
            }
        }

        // 2. USERS & BALANCE MANAGEMENT
        function renderUsers() {
            const list = document.getElementById('adminUserList');
            const select = document.getElementById('selectUser');
            list.innerHTML = '';
            select.innerHTML = '<option value="">-- ជ្រើសរើសអតិថិជន --</option>';

            users.forEach(u => {
                list.innerHTML += `
                    <div class="p-2.5 border rounded-lg text-xs bg-gray-50 space-y-1">
                        <div class="flex justify-between font-bold text-gray-900">
                            <span>📧 ${u.email}</span>
                            <span class="text-emerald-600">Balance: $${u.balance.toFixed(2)}</span>
                        </div>
                        <p class="text-gray-500 text-[11px]">📱 លេខទូរសព្ទ: ${u.phone}</p>
                    </div>
                `;
                select.innerHTML += `<option value="${u.id}">${u.email} (${u.phone})</option>`;
            });
        }

        function topupUserBalance() {
            const userId = document.getElementById('selectUser').value;
            const amount = parseFloat(document.getElementById('topupAmount').value);

            if (!userId || isNaN(amount) || amount <= 0) {
                alert('សូមជ្រើសរើសអតិថិជន និងបញ្ចូលចំនួនទឹកប្រាក់ឱ្យត្រឹមត្រូវ!');
                return;
            }

            const user = users.find(u => u.id == userId);
            if (user) {
                user.balance += amount;
                localStorage.setItem('store_users', JSON.stringify(users));
                renderUsers();
                document.getElementById('topupAmount').value = '';
                alert(`បានដាក់ប្រាក់ចំនួន $${amount.toFixed(2)} ជូន ${user.email} ដោយជោគជ័យ!`);
            }
        }

        // 3. DISCOUNT CODES MANAGEMENT
        function renderDiscounts() {
            const list = document.getElementById('adminPromoList');
            list.innerHTML = '';
            discounts.forEach((d, index) => {
                list.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 border rounded-lg text-xs bg-gray-50">
                        <div>
                            <span class="font-bold text-purple-700 tracking-wider">🏷️ ${d.code}</span>
                            <span class="ml-2 text-gray-500">បញ្ចុះតម្លៃ: $${d.discount.toFixed(2)}</span>
                        </div>
                        <button onclick="deleteDiscount(${index})" class="bg-red-100 text-red-600 px-2.5 py-1 rounded font-bold hover:bg-red-200"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function addPromoCode() {
            const code = document.getElementById('promoCode').value.toUpperCase();
            const discount = parseFloat(document.getElementById('promoDiscount').value);

            if (!code || isNaN(discount)) {
                alert('សូមបំពេញកូដ និងទឹកប្រាក់បញ្ចុះតម្លៃឱ្យបានត្រឹមត្រូវ!');
                return;
            }

            discounts.push({ code: code, discount: discount });
            localStorage.setItem('store_discounts', JSON.stringify(discounts));
            
            document.getElementById('promoCode').value = '';
            document.getElementById('promoDiscount').value = '';
            renderDiscounts();
            alert('បានបង្កើតកូដបញ្ចុះតម្លៃដោយជោគជ័យ!');
        }

        function deleteDiscount(index) {
            discounts.splice(index, 1);
            localStorage.setItem('store_discounts', JSON.stringify(discounts));
            renderDiscounts();
        }
    </script>
</body>
</html>
